name: Sunucu işleri

# Elle başlatılır. Depo herkese açık olduğundan sunucu çıktısı günlüğe yazılmaz: uzak.py bütün çıktıyı sahibinin açık
# anahtarıyla şifreler ve yapıt olarak saklar; günlükte yalnız "GENEL: " satırları ve çıkış kodu görünür.

on:
  workflow_dispatch:
    inputs:
      islem:
        description: Yapılacak iş
        required: true
        type: choice
        options:
          - inceleme
          - kaynak-inceleme
          - kurulum-deneme
          - kurulum
          - bakim-ac
          - bakim-kapat
          - tasima-prova
          - tasima-gercek
          - deneme-hesabi-kapat

permissions:
  contents: read

concurrency:
  group: peyrev-sunucu
  cancel-in-progress: false

jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Araçlar
        run: python -m pip install --disable-pip-version-check -q "paramiko>=3.5,<5" "cryptography>=42"
      - name: İşi seç
        id: is
        env:
          ISLEM: ${{ inputs.islem }}
        run: |
          case "$ISLEM" in
            inceleme)       betik=deploy/inceleme.sh; ortam='{}' ;;
            kaynak-inceleme) betik=deploy/kaynak-inceleme.sh; ortam='{}' ;;
            kurulum-deneme) betik=deploy/kurulum.sh;  ortam='{"KIP":"deneme"}' ;;
            kurulum)        betik=deploy/kurulum.sh;  ortam='{"KIP":"uygula"}' ;;
            bakim-ac)       betik=deploy/bakim.sh;    ortam='{"KIP":"ac"}' ;;
            bakim-kapat)    betik=deploy/bakim.sh;    ortam='{"KIP":"kapat"}' ;;
            tasima-prova)   betik=deploy/tasima.sh;   ortam='{"KIP":"prova"}' ;;
            tasima-gercek)  betik=deploy/tasima.sh;   ortam='{"KIP":"gercek"}' ;;
            deneme-hesabi-kapat) betik=deploy/deneme-hesabi.sh; ortam='{}' ;;
            *) echo "Bilinmeyen iş"; exit 1 ;;
          esac
          { echo "betik=$betik"; echo "ortam=$ortam"; } >> "$GITHUB_OUTPUT"
      - name: Sunucuda çalıştır
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          BETIK: ${{ steps.is.outputs.betik }}
          BETIK_ORTAMI: ${{ steps.is.outputs.ortam }}
          RAPOR: rapor.enc
        run: python .github/scripts/uzak.py
      - name: Şifreli raporu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapor-${{ inputs.islem }}
          path: rapor.enc
          retention-days: 3
          if-no-files-found: ignore
