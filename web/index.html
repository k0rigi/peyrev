<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peyrev</title>
<link rel="icon" href="/assets/peyrev-mark-32.png">
<style>
  :root { color-scheme: light dark; --bg: #f6f4ef; --fg: #1d1b16; --muted: #6b665c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12110e; --fg: #f2efe7; --muted: #a49d8f; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { text-align: center; padding: 24px 16px; }
  img { width: 96px; height: 96px; }
  h1 { margin: 12px 0 4px; font-size: 28px; letter-spacing: .02em; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <img src="/assets/peyrev-mark-192.png" alt="">
  <h1>Peyrev</h1>
  <p>Akış stüdyosu. Sayfa hazırlanıyor.</p>
</main>
</body>
</html>
