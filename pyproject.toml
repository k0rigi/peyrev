[project]
name = "peyrev-server"
version = "1.0.0"
description = "Peyrev merkezi sunucusu: lisans, hesaplar, destek, ajan ofisleri, yönetim paneli"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0,<4",
    "werkzeug>=3.0,<4",
    "gunicorn>=22,<24",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "PyJWT>=2.8,<3",
    "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8", "pgserver>=0.1.4"]
mysql = ["mysql-connector-python>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
peyrev = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
